        服务端 offered 的非批准选项（无拒绝选项即抛错、由超时收口）；exec 面仅在
        unattended-sandboxed 传 documented `--disable-approval`；审批/提问投影为可见活动行
        并计数；`--yolo` / 关闭 sandbox 永不出现在 argv。
      - R4：workspaceRoot 策略边界 + spawn 前收敛校验（workspaceViolation fail-closed）；
        MSP 面官方 session/start workspaceRoot / workspaceRoots；exec 面 cwd 收敛（不虚构
        `--workspace` 旗标）。
      - R5：buildMuseChildEnv 子进程环境允许清单（exec/MSP host/版本探针/状态探针/登录
        启动统一应用）；Host 集成凭据绝不进入子进程树。
      - R6：delegated 轮 cost: null（未申报）绝不记 0；协议 schema cost 放宽为
