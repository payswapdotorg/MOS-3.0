        并计数；`--yolo` / 关闭 sandbox 永不出现在 argv。
      - R4：workspaceRoot 策略边界 + spawn 前收敛校验（workspaceViolation fail-closed）；
        MSP 面官方 session/start workspaceRoot / workspaceRoots；exec 面 cwd 收敛（不虚构
