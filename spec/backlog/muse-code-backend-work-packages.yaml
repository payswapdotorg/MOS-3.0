    tasks:
      - ACR-0002 裁决与边界（单执行环、凭据红线、双门控）。
      - shared 契约（status/settings schema、信封 executionBackend、capability、channel、设置文件路径约定）。
      - contracts MuseExecutionPort + core delegated turn（事件投影、持久化、取消/失败收口）+ turn 路由分支。
      - bootstrap 进程端口（spawn/树终止/超时/stderr 上限）+ JSONL 宽容映射 + capability + v4 fail-closed 准入。
      - Host IMuseCodeService（探测/设置持久化/登录命令门控）+ 注册/访问器/renderer 接线。
      - UI：设置分区（状态卡/Recheck/Connect/开关/高级项/计费 copy）+ Composer 指示器 + 信封双门控 + i18n。
      - 契约测试（mock）+ 回归 + architecture admission + 证据文件。
    deliverables:
      - adapter_source
      - settings_and_status_surface
      - contract_tests
      - on_machine_verification_checklist
    acceptance:
      - 信封字段缺省时零行为变化（普通模型路径原样）。
      - 委托轮复用 TurnStarted/TurnComplete/Stop/冷恢复/mission linkage 既有机制，无双工具环。
      - 无凭据读取/复制/展示；auth/contributor 未知即未知。
      - busy/queue/guide/choice 委托输入一律 ACK 前拒绝（不静默改道）。
      - mock 契约测试全绿；在机验证清单就绪（AGENTS.md §7：本阶段为 contract-tested / integrated，非 verified）。
