        Composer 后端激活时锁定模型选择并明示原因。
      - R7：rebase 到 main@703fd7bd（保留 RC3 出版记录条目）+ 全链路本地验证（受影响包
        构建、tsc、muse 契约套件、回归、全量工程套件、lint、架构治理/检查、发布测试、
        文档短语、SQLite schema 契约）；CI + 评审以推送 head 为准。
