      tenant_id: string
      experiment_ref: string
      calibration: object
      recommendation: nullable-string
      delayed_mode: boolean
      evidence_refs: array
      created_at: timestamp
      updated_at: timestamp
invariants:
  - A capability instance is never available unless a live connection/account check and required scope checks support that assertion.
  - Provider static profile is not evidence of a tenant's account capability.
  - Unsupported and unknown are distinct states.
  - Every side-effecting external action has a preview and existing ZCode permission approval binding.
  - Every external action has tenant, connection, target, operation, side-effect and idempotency/reconciliation information.
  - Every observed fact has source and observed_at; simulation cannot be stored as provider observation.
  - Artifact versions and their parent lineage are immutable.
  - A node service offer is never published without every architecture §8 disclosure; missing or unknown disclosures keep the offer in draft with explicit missing fields.
  - A hypothesis record never carries an experiment outcome; outcomes belong to the Experiment authority (decision lock 18).
  - A research finding never cites a simulation as a provider observation.
  - Node and offer records are tenant-scoped; cross-tenant reads and writes fail closed.
  - A rights gate never guesses: an artifact is cleared for use only with a granted, unexpired rights decision covering it; missing, pending, expired and restricted all deny (fail-closed).
  - MOS owns no second executor (decision lock 5): production jobs record durable business state and reference external ZCode execution ids; a job never executes anything itself.
  - Domain code never imports concrete engines (decision lock 9): engine references in production graphs resolve through the engine registry by opaque id.
  - An experiment outcome is written only by the Experiment authority and only with measurement evidence; hypothesis records never carry outcomes (decision lock 18).
  - A side-effecting distribution intent is never executing/succeeded without an approved preview binding (preview + approval state).
  - Calibration records cite only concluded experiments with evidence and are delayed-mode: they are recommendation records only and never mutate routes or production directly.
  - Provider secrets are represented only by opaque credential_ref.
  - No missing value is inferred from a marketing brief.
compatibility:
  - Keep ZCode session/task identifiers as external references; do not duplicate messages or transcript state.
  - Preserve existing ZCode plugin manifest and MCP tool schemas; MOS descriptors map onto them.
  - Only TL may revise this core contract during Week 1.
