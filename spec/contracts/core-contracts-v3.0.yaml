  DistributionIntent:
    required: [id, tenant_id, operation, connection_id, capability_instance_id, artifact_ref, status, created_at]
    fields:
      id: string
      tenant_id: string
      operation: enum
      connection_id: string
      capability_instance_id: string
      artifact_ref: string
      artifact_version: nullable-integer
      target: object
      preview_ref: nullable-string
      preview_hash: nullable-string
      approval_state: enum
      idempotency_key: nullable-string
      status: enum
