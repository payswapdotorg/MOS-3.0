      updated_at: timestamp
  Experiment:
    required: [id, tenant_id, statement, status, created_at]
    fields:
      id: string
      tenant_id: string
      mission_id: nullable-string
      hypothesis_id: nullable-string
      statement: string
      design: object
      assignment: nullable-object
      measurement_evidence_refs: array
