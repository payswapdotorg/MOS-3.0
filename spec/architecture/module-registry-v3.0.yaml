    # 组合根所有权决议 = TL 拥有、落在 mos-studio 包（W1 起的 blocker 就此关闭）。
    # 挂载形态 = ZCode 插件（.zcode-plugin/plugin.json ui.surfaces + slots nav.primary/sidePane.launcher
