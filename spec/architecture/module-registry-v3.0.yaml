# Week 1 实现说明（2026-11-12）：
#   - 七个 week-1 模块（本文件 id）已在分支 w1/integration-foundation 实现；contract-tested。
#   - 本文件模块 id zcode-substrate-adapters 在仓库治理层（architecture-policy.yaml）登记为
#     zcode-mos-adapters（目录 packages/zcode-mos-adapters）；同一权威、两个命名空间的映射在此记录。
