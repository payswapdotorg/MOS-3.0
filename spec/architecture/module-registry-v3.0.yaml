    note: 生产 src/runtime 经 @zcode/adapters 组合真实 ZCode MCP 客户端与真实共享加密凭据存储（组合根专属；默认 typecheck 排除，见 packages/mos-studio/src/CONTRACT.md）。Desktop 可视挂载与 desktop E2E 仍 blocked（无 docker/显示）。
  - id: mos-distribution
