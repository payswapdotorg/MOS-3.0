    # 生产域缝（production graph + artifact + rights 读取，W3 交付）的生产面接线仍 planned（后续 studio 里程碑）。
    depends_on: [mos-contracts, mos-identity-bridge, mos-missions, mos-integrations, mos-capabilities, mos-routes, zcode-substrate-adapters, zcode-host]
