schema_version: 1
product: MOS-3.0
governance:
  max_parallel_workstreams: 3
  architecture_owner: TL
  central_composition_owner: TL
  no_cyclic_dependencies: true
  domain_provider_calls_forbidden: true
  engine_direct_imports_forbidden: true
  versioned_contracts_required: true
  tenant_scope_required: true
  durable_business_state_required: true
  preserve_zcode_as_host: true
modules:
  - id: mos-contracts
    responsibility: Versioned provider-neutral domain contracts and event envelopes
    authority: contracts
    depends_on: []
    stage: week-1
    status: contract-tested  # W1 2026-11-12：实现+契约测试全绿；状态词汇见 AGENTS.md §7
  - id: mos-identity-bridge
    responsibility: Map ZCode identity, org and workspace context to MOS tenant/brand context
    authority: identity-mapping
    depends_on: [mos-contracts, zcode-substrate-adapters]
    stage: week-1
    status: contract-tested  # W1 2026-11-12：实现+契约测试全绿；状态词汇见 AGENTS.md §7
  - id: mos-missions
    responsibility: Mission/objective intake and ZCode session association
    authority: missions
    depends_on: [mos-contracts, mos-identity-bridge, zcode-substrate-adapters]
    stage: week-1
    status: contract-tested  # W1 2026-11-12：实现+契约测试全绿；状态词汇见 AGENTS.md §7
  - id: mos-integrations
    responsibility: Provider connections, account capability bindings, adapters, webhooks and provider evidence
    authority: integrations
    depends_on: [mos-contracts, mos-identity-bridge, zcode-substrate-adapters]
    stage: week-1
    status: contract-tested  # W1 2026-11-12：实现+契约测试全绿；状态词汇见 AGENTS.md §7
  - id: mos-capabilities
